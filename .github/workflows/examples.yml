name: examples

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gecode_repository:
        description: "Gecode repository used for validation"
        required: false
        default: "Gecode/gecode"
      gecode_ref:
        description: "Gecode branch, tag, or commit used for validation"
        required: false
        default: "main"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install locked project dependencies
        run: uv sync --locked --python 3.12
      - name: Checkout Gecode sources
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.gecode_repository || 'Gecode/gecode' }}
          ref: ${{ github.event.inputs.gecode_ref || 'main' }}
          path: gecode-source
          persist-credentials: false
      - name: Build selected Gecode ref
        run: |
          cmake -S "$GITHUB_WORKSPACE/gecode-source" -B "$GITHUB_WORKSPACE/gecode-source/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGECODE_ENABLE_QT=OFF \
            -DGECODE_ENABLE_GIST=OFF \
            -DGECODE_ENABLE_MPFR=OFF \
            -DGECODE_ENABLE_CPPROFILER=OFF
          cmake --build "$GITHUB_WORKSPACE/gecode-source/build" --parallel
      - name: Python unit tests
        run: uv run --locked --python 3.12 -- python -m unittest discover -s tests -p "test_*.py"
      - name: Validate published examples
        run: uv run --locked --python 3.12 -- python rst/scripts/verify_examples.py --gecode-root "$GITHUB_WORKSPACE/gecode-source"
