project:
  type: book
  output-dir: _build/site
  pre-render:
    - python3 scripts/render_figures.py

book:
  title: "Modeling and Programming with Gecode"
  subtitle: "Document-first publishing prototype"
  author:
    - Christian Schulte
    - Guido Tack
    - Mikael Z. Lagerkvist
  chapters:
    - index.qmd
    - modeling.qmd
    - references.qmd
  downloads: [pdf]
  repo-url: https://github.com/Gecode/MPG

bibliography: references.bib
filters:
  - filters/include-code.lua
  - filters/vector-format.lua
crossref:
  chapters: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
  pdf:
    documentclass: scrreprt
    papersize: a4
    pdf-engine: xelatex
    keep-tex: true
    colorlinks: true
    geometry:
      - margin=28mm
    include-in-header:
      text: |
        \usepackage{microtype}
