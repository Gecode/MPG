<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-labelledby="title desc">
  <title id="title">A small search tree</title>
  <desc id="desc">One root branches to a failed node and a solved node.</desc>
  <g fill="none" stroke="#315d4c" stroke-width="4">
    <path d="M310 52 L155 153 M310 52 L465 153"/>
  </g>
  <g stroke="#173f32" stroke-width="3">
    <circle cx="310" cy="48" r="32" fill="#dff4e8"/>
    <circle cx="155" cy="160" r="32" fill="#f9dddd"/>
    <circle cx="465" cy="160" r="32" fill="#dff4e8"/>
  </g>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#15372d">
    <text x="310" y="56">root</text><text x="155" y="168">fail</text><text x="465" y="168">solve</text>
  </g>
</svg>
