version: 1
project:
  id: mpg-myst-astro-spike
  title: Modeling and Programming with Gecode - MyST/Astro spike
  description: A bounded test of MyST document semantics inside an Astro release flow.
  authors:
    - name: MPG prototype team
  license: CC-BY-4.0
  bibliography:
    - content/references.bib
  plugins:
    - type: javascript
      path: plugins/gecode-api.mjs
  math:
    '\Model': '\mathcal{M}'
  numbering:
    headings: true
  toc:
    - file: content/index.md
    - file: content/second-page.md
    - file: content/overview.md
    - file: content/crossword.md
    - file: content/nonogram.md
  exports:
    - format: tex
      template: templates/plain-latex-book
      output: generated/mpg-myst-astro-spike.tex
      articles:
        - content/index.md
        - content/second-page.md
        - content/overview.md
        - content/crossword.md
        - content/nonogram.md
    - format: pdf
      template: templates/plain-latex-book
      output: exports/mpg-myst-astro-spike.pdf
      articles:
        - content/index.md
        - content/second-page.md
        - content/overview.md
        - content/crossword.md
        - content/nonogram.md
site:
  template: templates/headless-site
  options:
    folders: true
