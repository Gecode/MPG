<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">A tiny search tree</title>
  <desc id="desc">A root search node branches left to a failed node and right to a solved node.</desc>
  <defs>
    <style>
      .edge { stroke: #334155; stroke-width: 4; }
      .node { stroke: #0f172a; stroke-width: 4; }
      .label { fill: #0f172a; font: 600 24px system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <line class="edge" x1="320" y1="72" x2="175" y2="190" />
  <line class="edge" x1="320" y1="72" x2="465" y2="190" />
  <circle class="node" cx="320" cy="62" r="40" fill="#dbeafe" />
  <circle class="node" cx="165" cy="200" r="40" fill="#fee2e2" />
  <circle class="node" cx="475" cy="200" r="40" fill="#dcfce7" />
  <text class="label" x="320" y="70">root</text>
  <text class="label" x="165" y="208">fail</text>
  <text class="label" x="475" y="208">solve</text>
</svg>
