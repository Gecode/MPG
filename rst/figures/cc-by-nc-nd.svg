     role="img" aria-labelledby="title description">
  <title id="title">Creative Commons BY-NC-ND</title>
  <desc id="description">Creative Commons licence symbols for attribution, noncommercial use, and no derivatives.</desc>
  <g fill="none" stroke="#0b7646" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="21" cy="21" r="18"/>
    <circle cx="67" cy="21" r="18"/>
